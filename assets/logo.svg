<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Outer hexagonal shield -->
  <path d="M32 4L56 18V46L32 60L8 46V18L32 4Z" fill="#0a0f1e" stroke="url(#shieldGrad)" stroke-width="2" filter="url(#glow)"/>
  <!-- Inner circuit pattern -->
  <path d="M32 12L48 22V42L32 52L16 42V22L32 12Z" fill="none" stroke="url(#innerGrad)" stroke-width="1" opacity="0.4"/>
  <!-- Lock body -->
  <rect x="24" y="28" width="16" height="14" rx="3" fill="url(#shieldGrad)" opacity="0.9"/>
  <!-- Lock shackle -->
  <path d="M27 28V23C27 19.13 29.24 16 32 16C34.76 16 37 19.13 37 23V28" fill="none" stroke="url(#shieldGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Keyhole -->
  <circle cx="32" cy="33" r="2.5" fill="#0a0f1e"/>
  <rect x="31" y="34" width="2" height="4" rx="1" fill="#0a0f1e"/>
  <!-- Circuit nodes -->
  <circle cx="20" cy="20" r="1.5" fill="#00d4ff" opacity="0.7"/>
  <circle cx="44" cy="20" r="1.5" fill="#8b5cf6" opacity="0.7"/>
  <circle cx="20" cy="44" r="1.5" fill="#8b5cf6" opacity="0.7"/>
  <circle cx="44" cy="44" r="1.5" fill="#00d4ff" opacity="0.7"/>
  <!-- Circuit traces -->
  <line x1="20" y1="20" x2="24" y2="28" stroke="#00d4ff" stroke-width="0.8" opacity="0.4"/>
  <line x1="44" y1="20" x2="40" y2="28" stroke="#8b5cf6" stroke-width="0.8" opacity="0.4"/>
  <line x1="20" y1="44" x2="24" y2="42" stroke="#8b5cf6" stroke-width="0.8" opacity="0.4"/>
  <line x1="44" y1="44" x2="40" y2="42" stroke="#00d4ff" stroke-width="0.8" opacity="0.4"/>
</svg>
